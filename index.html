<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAPI BITE — Vapi Food Delivery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f3;color:#222}
header{background:#ff5a1f;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:800}.tag{font-size:12px;opacity:.9}
.cart{background:#fff;color:#ff5a1f;border:0;border-radius:22px;padding:10px 15px;font-weight:700}
.hero{max-width:1100px;margin:auto;padding:42px 16px 25px}.hero h1{font-size:40px;margin:0 0 10px}.hero p{font-size:18px;color:#666}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.cats{display:flex;gap:10px;overflow:auto;padding:18px 0}.cat{border:0;background:#fff;padding:11px 16px;border-radius:22px;white-space:nowrap;box-shadow:0 2px 10px #00000010}
.grid{max-width:1100px;margin:auto;padding:0 16px 90px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #00000012}.pic{height:150px;background:#ffe2d4;display:flex;align-items:center;justify-content:center;font-size:65px}.info{padding:15px}.info h3{margin:0 0 6px}.price{font-weight:800;font-size:18px}.add{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:#ff5a1f;color:#fff;font-weight:700}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10}.panel{position:absolute;right:0;top:0;height:100%;width:min(430px,100%);background:#fff;padding:20px;overflow:auto}
.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:13px 0}.qty button{border:0;background:#eee;border-radius:7px;padding:5px 9px}.total{font-size:22px;font-weight:800;margin:20px 0}.checkout input,.checkout textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}.cod{background:#fff2ea;padding:12px;border-radius:10px;margin:10px 0}.place{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header><div class="top"><div><div class="logo">VAPI BITE 🍔</div><div class="tag">Vapi ka apna food delivery</div></div><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button></div></header>

<section class="hero">
<h1>What are you craving? 😋</h1><p>Vapi mein apna favourite food ghar par order karo.</p>
<input class="search" id="search" placeholder="Search pizza, burger, biryani..." oninput="render()">
<div class="cats"><button class="cat" onclick="filterCat('All')">All</button><button class="cat" onclick="filterCat('Pizza')">🍕 Pizza</button><button class="cat" onclick="filterCat('Burger')">🍔 Burger</button><button class="cat" onclick="filterCat('Biryani')">🍗 Biryani</button><button class="cat" onclick="filterCat('Snacks')">🍟 Snacks</button><button class="cat" onclick="filterCat('Drinks')">🥤 Drinks</button></div>
</section>

<main class="grid" id="products"></main>
<footer>VAPI BITE • Delivery within Vapi • Payment: Cash on Delivery only</footer>

<div class="overlay" id="overlay"><div class="panel">
<button class="close" onclick="closeCart()">✕</button><h2>Your Cart 🛒</h2><div id="cartItems"></div><div class="total">Total: ₹<span id="total">0</span></div>
<div class="checkout"><h3>Delivery Details</h3><input id="name" placeholder="Your name"><input id="phone" placeholder="Mobile number"><textarea id="address" rows="3" placeholder="Full delivery address in Vapi"></textarea>
<div class="cod">💵 <b>Cash on Delivery</b><br><small>Payment delivery ke time cash mein.</small></div>
<button class="place" onclick="placeOrder()">Place COD Order</button></div>
</div></div>

<script>
const products=[
{id:1,n:"Margherita Pizza",p:149,c:"Pizza",e:"🍕"},{id:2,n:"Cheese Burger",p:99,c:"Burger",e:"🍔"},
{id:3,n:"Chicken Biryani",p:179,c:"Biryani",e:"🍗"},{id:4,n:"Veg Biryani",p:129,c:"Biryani",e:"🍚"},
{id:5,n:"French Fries",p:79,c:"Snacks",e:"🍟"},{id:6,n:"Paneer Roll",p:109,c:"Snacks",e:"🌯"},
{id:7,n:"Cold Drink",p:49,c:"Drinks",e:"🥤"},{id:8,n:"Masala Sandwich",p:89,c:"Snacks",e:"🥪"}];
let cart={},cat="All";
function filterCat(x){cat=x;render()}
function render(){let q=document.getElementById("search").value.toLowerCase();let a=products.filter(x=>(cat==="All"||x.c===cat)&&x.n.toLowerCase().includes(q));document.getElementById("products").innerHTML=a.map(x=>`<article class="card"><div class="pic">${x.e}</div><div class="info"><h3>${x.n}</h3><div class="price">₹${x.p}</div><button class="add" onclick="add(${x.id})">Add to Cart</button></div></article>`).join("")}
function add(id){cart[id]=(cart[id]||0)+1;update()}
function update(){let count=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById("count").textContent=count}
function openCart(){document.getElementById("overlay").style.display="block";drawCart()}
function closeCart(){document.getElementById("overlay").style.display="none"}
function drawCart(){let entries=Object.entries(cart);let total=0;document.getElementById("cartItems").innerHTML=entries.length?entries.map(([id,q])=>{let x=products.find(p=>p.id==id);total+=x.p*q;return `<div class="item"><div><b>${x.n}</b><br>₹${x.p} × ${q}</div><div class="qty"><button onclick="change(${id},-1)">−</button> ${q} <button onclick="change(${id},1)">+</button></div></div>`}).join(""):"<p>Your cart is empty.</p>";document.getElementById("total").textContent=total}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];update();drawCart()}
function placeOrder(){let n=document.getElementById("name").value.trim(),ph=document.getElementById("phone").value.trim(),ad=document.getElementById("address").value.trim();if(!Object.keys(cart).length)return alert("Cart empty hai.");if(!n||!ph||!ad)return alert("Name, mobile aur address bharo.");alert("Order placed! 🎉\\nPayment: Cash on Delivery\\nVAPI BITE aapka order confirm karega.");cart={};update();closeCart()}
render();
</script>
</body></html>
